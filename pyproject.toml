[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-agent-bench"
version = "0.1.0"
description = "Small, inspectable benchmarks for single and multi-agent systems"
requires-python = ">=3.12"
dependencies = ["harbor==0.22.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
pocket-bench = "pocket_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocket_bench = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
