schema_version = "1.4"
[task]
name = "pocket/workflow-long"
version = "1.1.0"
[metadata]
category = "api"
tags = ["extended", "sequential"]
source = "pocket-original"
human_reviewed = false
capabilities = ["filesystem", "python", "http-loopback"]
network_enforcement = "compose-internal-model-proxy-v1"
