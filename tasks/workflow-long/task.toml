[agent]
user = "agent"
timeout_sec = 3690.0
[verifier]
user = "root"
timeout_sec = 45.0
environment_mode = "separate"
[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 2048
[environment]
# Egress is enforced by the internal Compose network and model-only proxy.
network_mode = "public"
cpus = 2
memory_mb = 2048
build_timeout_sec = 600.0
