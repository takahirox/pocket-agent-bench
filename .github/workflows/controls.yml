name: Docker verifier controls
on: workflow_dispatch
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/build_runtime.py
      - run: uv run pocket-bench run --name controls --profiles oracle,nop --attempts 1 --concurrency 2
      - run: |
          uv run python -c 'import json; s=json.load(open("results/reports/controls/results.json"))["summary"]; assert (s["success"],s["failure"],s["unscorable"]) == (12,12,0), s'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-controls
          path: results/
